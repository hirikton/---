<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой первый сайт</title>
    <link rel="stylesheet" href="css/index.css"> </head>

    <body>

    <!--Шапка сайта-->
    <header>
        <h1>Мой первый сайт</h1>
        <p>Учебный проект по HTML и CSS</p>
    </header>


    <!-- Навигация -->
    <nav>
        <ul>
            <li><a href="#home">Главная</a></li>
            <li><a href="#about">О нас</a></li>
            <li><a href="#services">Услуги</a></li>
            <li><a href="#gallery">Галерея</a></li>
            <li><a href="#contacts">Контакты</a></li>
        </ul>
    </nav>

    <!-- Основной контент -->
    <main>
      <fieldset>
        <legend>Регистрация</legend>
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" required minlength="2 />" />

        <label> for="email">Email</label>
        <input type="email" id="email" name="email" required />"

        <label for="password">Пароль</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
        />
        <label for="birthdate">Дата рождения</label>
        <input type="date" id="birthday" name="birthday" name="birthdate" />

        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" pattern="\+7\8(10)" />
      </fieldset>

      <fieldset>
        <legend>Пол</legend>
        <label>
          ><input type="radio" name="gender" value="male" />Мужской</label
        >
        <label
          ><input type="radio" name="gender" value="female" /> Женский</label
        >
      </fieldset>

      <fieldset>
        <button type="submit">Зарегистрироваться</button>
        <button type="reset">Очистить</button>
      </fieldset>
    </main>

    <!-- Подвал -->
    <footer>
        <p>&copy; 2026 Мой первый сайт. Все права защищены</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
